name: Independent package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Run installed package tests outside the source checkout
        run: |
          cp tests/test_pipeline.py "$RUNNER_TEMP/test_pipeline.py"
          cd "$RUNNER_TEMP"
          python -I test_pipeline.py -q
          python -I -c "import importlib.util; assert importlib.util.find_spec('asset_workbench') is None"
      - run: python -m pip wheel --no-deps . -w dist
